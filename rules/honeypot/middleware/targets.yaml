- method: GET
  path: /targets
  status: 200
  content-type: text/html
  headers:
    Server: nginx/1.24.0
  body: "<!DOCTYPE html>\n<html>\n<head>\n    <title>Prometheus Targets</title>\n\
    \    <style>\n        body { font-family: 'Helvetica Neue', Arial, sans-serif;\
    \ background: #fff; margin: 0; padding: 20px; }\n        .navbar { background:\
    \ #e6522c; padding: 10px 20px; color: #fff; font-size: 18px; font-weight: bold;\
    \ margin: -20px -20px 20px -20px; }\n        table { border-collapse: collapse;\
    \ width: 100%; font-size: 13px; }\n        th { background: #f8f8f8; padding:\
    \ 8px; text-align: left; border-bottom: 2px solid #ddd; }\n        td { padding:\
    \ 8px; border-bottom: 1px solid #eee; }\n        .up { color: #090; font-weight:\
    \ bold; }\n        .down { color: #c00; font-weight: bold; }\n    </style>\n</head>\n\
    <body>\n    <div class=\"navbar\">Prometheus</div>\n    <h2>Targets</h2>\n   \
    \ <table>\n    <tr><th>Endpoint</th><th>State</th><th>Labels</th><th>Last Scrape</th><th>Error</th></tr>\n\
    \    <tr><td>http://localhost:9090/metrics</td><td class=\"up\">UP</td><td>job=\"\
