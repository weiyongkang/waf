    \ class=\"up\">UP</td><td>job=\"node\"</td><td>5.3s ago</td><td></td></tr>\n \
    \   <tr><td>http://db01:9187/metrics</td><td class=\"down\">DOWN</td><td>job=\"\
    postgres\"</td><td>1m32s ago</td><td>connection refused</td></tr>\n    </table>\n\
    </body>\n</html>\n"
