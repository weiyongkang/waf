- method: GET
  path: /dashboard/
  status: 200
  content-type: text/html
  headers:
    Server: nginx/1.25.3
  body: "<!DOCTYPE html>\n<html>\n<head>\n    <title>Traefik Dashboard</title>\n \
    \   <style>\n        body { font-family: -apple-system, system-ui, sans-serif;\
    \ background: #1a202c; display: flex; justify-content: center; align-items: center;\
    \ height: 100vh; margin: 0; color: #e2e8f0; }\n        .login-box { background:\
    \ #2d3748; padding: 40px; border-radius: 6px; width: 340px; }\n        .login-box\
    \ h2 { text-align: center; color: #63b3ed; margin-bottom: 24px; font-weight: 400;\
    \ }\n        .login-box input { width: 100%; padding: 10px; margin-bottom: 12px;\
    \ background: #1a202c; border: 1px solid #4a5568; border-radius: 4px; color: #e2e8f0;\
    \ box-sizing: border-box; }\n        .login-box button { width: 100%; padding:\
    \ 10px; background: #3182ce; color: #fff; border: none; border-radius: 4px; cursor:\
    \ pointer; }\n    </style>\n</head>\n<body>\n    <div class=\"login-box\">\n \
    \       <h2>Traefik Dashboard</h2>\n        <form method=\"POST\" action=\"/dashboard/auth\"\
    >\n            <input type=\"text\" name=\"user\" placeholder=\"Username\">\n\
    \            <input type=\"password\" name=\"password\" placeholder=\"Password\"\
    >\n            <button type=\"submit\">Login</button>\n        </form>\n    </div>\n\
    </body>\n</html>\n"
