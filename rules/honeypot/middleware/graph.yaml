# 可观测性中间件管理页面
- method: GET
  path: /graph
  status: 200
  content-type: text/html
  headers:
    Server: nginx/1.24.0
  body: "<!DOCTYPE html>\n<html>\n<head>\n    <title>Prometheus Graph</title>\n  \
    \  <style>\n        body { font-family: 'Helvetica Neue', Arial, sans-serif; background:\
    \ #fff; margin: 0; padding: 20px; color: #333; }\n        .navbar { background:\
    \ #e6522c; padding: 10px 20px; color: #fff; font-size: 18px; font-weight: bold;\
    \ margin: -20px -20px 20px -20px; }\n        .navbar span { font-size: 14px; font-weight:\
    \ normal; margin-left: 10px; color: #ffc; }\n        .nav-links { display: flex;\
    \ gap: 20px; margin-bottom: 20px; }\n        .nav-links a { color: #e6522c; text-decoration:\
    \ none; font-size: 14px; }\n        .nav-links a:hover { text-decoration: underline;\
    \ }\n        textarea { width: 100%; height: 80px; font-family: monospace; font-size:\
    \ 13px; border: 1px solid #ccc; padding: 8px; margin-bottom: 12px; box-sizing:\
    \ border-box; }\n        button { padding: 8px 16px; background: #e6522c; color:\
    \ #fff; border: none; cursor: pointer; border-radius: 3px; }\n        .graph-area\
    \ { border: 1px solid #ddd; height: 300px; background: #fafafa; display: flex;\
    \ align-items: center; justify-content: center; color: #999; }\n    </style>\n\
    </head>\n<body>\n    <div class=\"navbar\">Prometheus <span>Time Series Collection\
    \ and Processing Server</span></div>\n    <div class=\"nav-links\">\n        <a\
    \ href=\"/graph\">Graph</a>\n        <a href=\"/alerts\">Alerts</a>\n        <a\
    \ href=\"/targets\">Targets</a>\n        <a href=\"/status\">Status</a>\n    </div>\n\
    \    <textarea placeholder=\"Expression (press Shift+Enter for newlines)\">up{job=\"\
    node\"}</textarea>\n    <button type=\"submit\">Execute</button>\n    <div class=\"\
    graph-area\">Graph area — enter an expression and click Execute</div>\n</body>\n\
    </html>\n"
