- method: GET
  path: /actuator/mappings
  status: 200
  content-type: application/json
  headers:
    Server: nginx/1.25.3
  body: "{\n  \"contexts\": {\n    \"application\": {\n      \"mappings\": {\n   \
    \     \"dispatcherServlets\": {\n          \"dispatcherServlet\": [\n        \
    \    {\n              \"handler\": \"com.example.order.OrderController#listOrders()\"\
    ,\n              \"predicate\": \"{GET /api/orders}\",\n              \"details\"\
    : { \"handlerMethod\": { \"className\": \"com.example.order.OrderController\"\
    , \"name\": \"listOrders\" } }\n            },\n            {\n              \"\
    handler\": \"com.example.order.OrderController#getOrder(Long)\",\n           \
    \   \"predicate\": \"{GET /api/orders/{id}}\",\n              \"details\": { \"\
    handlerMethod\": { \"className\": \"com.example.order.OrderController\", \"name\"\
    : \"getOrder\" } }\n            },\n            {\n              \"handler\":\
    \ \"com.example.order.OrderController#createOrder(OrderRequest)\",\n         \
    \     \"predicate\": \"{POST /api/orders}\",\n              \"details\": { \"\
    handlerMethod\": { \"className\": \"com.example.order.OrderController\", \"name\"\
    : \"createOrder\" } }\n            }\n          ]\n        }\n      }\n    }\n\
    \  }\n}\n"
