- method: GET
  path: /kafka
  status: 200
  content-type: text/html
  headers:
    Server: nginx
  body: "<!DOCTYPE html>\n<html>\n<head>\n    <title>Kafka UI</title>\n    <style>\n\
    \        body { font-family: 'Inter', sans-serif; background: #1a1a2e; display:\
    \ flex; justify-content: center; align-items: center; height: 100vh; margin: 0;\
    \ }\n        .login-box { background: #16213e; padding: 40px; border-radius: 8px;\
    \ width: 340px; color: #e0e0e0; }\n        .login-box h2 { text-align: center;\
    \ color: #0f9; margin-bottom: 28px; font-weight: 500; }\n        .login-box label\
    \ { display: block; font-size: 13px; margin-bottom: 4px; color: #a0a0b0; }\n \
    \       .login-box input { width: 100%; padding: 10px; margin-bottom: 16px; background:\
    \ #1a1a2e; border: 1px solid #333355; border-radius: 4px; color: #e0e0e0; box-sizing:\
    \ border-box; }\n        .login-box button { width: 100%; padding: 10px; background:\
    \ #0f9; color: #1a1a2e; border: none; border-radius: 4px; cursor: pointer; font-weight:\
    \ 600; }\n    </style>\n</head>\n<body>\n    <div class=\"login-box\">\n     \
    \   <h2>Kafka UI</h2>\n        <form method=\"POST\" action=\"/kafka/auth\">\n\
    \            <label>Username</label>\n            <input type=\"text\" name=\"\
    username\" placeholder=\"Enter username\">\n            <label>Password</label>\n\
    \            <input type=\"password\" name=\"password\" placeholder=\"Enter password\"\
    >\n            <button type=\"submit\">Sign In</button>\n        </form>\n   \
    \ </div>\n</body>\n</html>\n"
