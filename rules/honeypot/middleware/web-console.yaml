- method: GET
  path: /web-console
  status: 200
  content-type: text/html
  headers:
    Server: Apache-Coyote/1.1
  body: "<!DOCTYPE html>\n<html>\n<head>\n    <title>JBoss Web Console</title>\n \
    \   <style>\n        body { font-family: Arial, sans-serif; background: #f5f5f5;\
    \ display: flex; justify-content: center; align-items: center; height: 100vh;\
    \ margin: 0; }\n        .login-box { background: #fff; padding: 40px; border:\
    \ 1px solid #ddd; width: 340px; }\n        .login-box h2 { text-align: center;\
    \ color: #c00; margin-bottom: 24px; font-size: 18px; }\n        .login-box input\
    \ { width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid #ccc; box-sizing:\
    \ border-box; }\n        .login-box button { width: 100%; padding: 8px; background:\
    \ #c00; color: #fff; border: none; cursor: pointer; }\n    </style>\n</head>\n\
    <body>\n    <div class=\"login-box\">\n        <h2>JBoss Web Console</h2>\n  \
    \      <form method=\"POST\" action=\"/web-console/auth\">\n            <input\
    \ type=\"text\" name=\"username\" placeholder=\"Username\">\n            <input\
    \ type=\"password\" name=\"password\" placeholder=\"Password\">\n            <button\
    \ type=\"submit\">Login</button>\n        </form>\n    </div>\n</body>\n</html>\n"
