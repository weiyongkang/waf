# 消息队列中间件管理页面
- method: GET
  path: /rabbitmq
  status: 200
  content-type: text/html
  headers:
    Server: Cowboy
  body: "<!DOCTYPE html>\n<html>\n<head>\n    <title>RabbitMQ Management</title>\n\
    \    <style>\n        body { font-family: 'Helvetica Neue', Arial, sans-serif;\
    \ background: #f9f9f9; display: flex; justify-content: center; align-items: center;\
    \ height: 100vh; margin: 0; }\n        .login-box { background: #fff; padding:\
    \ 36px; border: 1px solid #e0e0e0; border-radius: 4px; width: 300px; }\n     \
    \   .login-box h2 { text-align: center; color: #f60; margin-bottom: 20px; font-size:\
    \ 16px; }\n        .login-box label { display: block; font-size: 12px; color:\
    \ #666; margin-bottom: 4px; }\n        .login-box input { width: 100%; padding:\
    \ 8px; margin-bottom: 14px; border: 1px solid #ccc; border-radius: 2px; box-sizing:\
    \ border-box; font-size: 13px; }\n        .login-box button { width: 100%; padding:\
    \ 8px; background: #f60; color: #fff; border: none; border-radius: 2px; cursor:\
    \ pointer; }\n    </style>\n</head>\n<body>\n    <div class=\"login-box\">\n \
    \       <h2>RabbitMQ Management</h2>\n        <form method=\"POST\" action=\"\
    /rabbitmq/api/auth\">\n            <label>Username</label>\n            <input\
    \ type=\"text\" name=\"username\" placeholder=\"Username\">\n            <label>Password</label>\n\
    \            <input type=\"password\" name=\"password\" placeholder=\"Password\"\
    >\n            <button type=\"submit\">Login</button>\n        </form>\n    </div>\n\
    </body>\n</html>\n"
