# InfluxDB Web 管理界面
- method: GET
  path: "/influxdb"
  status: 200
  content-type: text/html
  headers:
    Server: "nginx"
  body: |
    <!DOCTYPE html>
    <html lang="en">
    <head><meta charset="utf-8"><title>InfluxDB Admin</title>
    <style>body{font-family:sans-serif;background:#f6f6f8;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#fff;padding:40px;border-radius:6px;width:340px;box-shadow:0 4px 16px rgba(0,0,0,.08)}.login-box .logo{text-align:center;color:#22adf6;font-size:24px;font-weight:600;margin-bottom:28px}.login-box input{width:100%;padding:10px;margin-bottom:14px;border:1px solid #d0d0d0;border-radius:4px;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#22adf6;color:#fff;border:none;border-radius:4px;cursor:pointer}</style></head>
    <body><div class="login-box"><div class="logo">InfluxDB</div><form method="POST" action="/influxdb/login"><input type="text" name="username" placeholder="Username"><input type="password" name="password" placeholder="Password"><button type="submit">Sign In</button></form></div></body></html>
