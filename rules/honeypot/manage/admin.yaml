# 通用后台管理登录页面
- method: GET
  path: /admin
  status: 200
  content-type: text/html
  headers:
    Server: nginx/1.24.0
  body: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <title>Admin Panel</title>\n    <style>\n        body { font-family: Arial,\
    \ sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items:\
    \ center; height: 100vh; margin: 0; }\n        .login-box { background: #fff;\
    \ padding: 40px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width:\
    \ 360px; }\n        .login-box h2 { text-align: center; color: #333; margin-bottom:\
    \ 30px; }\n        .login-box input { width: 100%; padding: 12px; margin-bottom:\
    \ 16px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }\n\
    \        .login-box button { width: 100%; padding: 12px; background: #1890ff;\
    \ color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;\
    \ }\n        .login-box button:hover { background: #40a9ff; }\n    </style>\n\
    </head>\n<body>\n    <div class=\"login-box\">\n        <h2>Admin Login</h2>\n\
    \        <form method=\"POST\" action=\"/admin/login\">\n            <input type=\"\
    text\" name=\"username\" placeholder=\"Username\" required>\n            <input\
    \ type=\"password\" name=\"password\" placeholder=\"Password\" required>\n   \
    \         <button type=\"submit\">Sign In</button>\n        </form>\n    </div>\n\
    </body>\n</html>\n"
