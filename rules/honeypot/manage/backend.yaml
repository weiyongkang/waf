- method: GET
  path: /backend
  status: 200
  content-type: text/html
  headers:
    Server: Apache/2.4.57
  body: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <title>Backend Management</title>\n    <style>\n        body { font-family:\
    \ 'Segoe UI', Tahoma, sans-serif; background: #1e1e2d; display: flex; justify-content:\
    \ center; align-items: center; height: 100vh; margin: 0; }\n        .login-box\
    \ { background: #2b2b40; padding: 48px; border-radius: 6px; width: 380px; color:\
    \ #cdd6f4; }\n        .login-box h2 { text-align: center; margin-bottom: 32px;\
    \ font-weight: 300; }\n        .login-box input { width: 100%; padding: 10px 14px;\
    \ margin-bottom: 20px; background: #1e1e2d; border: 1px solid #45475a; border-radius:\
    \ 4px; color: #cdd6f4; box-sizing: border-box; }\n        .login-box button {\
    \ width: 100%; padding: 12px; background: #89b4fa; color: #1e1e2d; border: none;\
    \ border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: 600; }\n\
    \    </style>\n</head>\n<body>\n    <div class=\"login-box\">\n        <h2>Backend\
    \ Management</h2>\n        <form method=\"POST\" action=\"/backend/auth\">\n \
    \           <input type=\"text\" name=\"username\" placeholder=\"Username\">\n\
    \            <input type=\"password\" name=\"password\" placeholder=\"Password\"\
    >\n            <button type=\"submit\">Login</button>\n        </form>\n    </div>\n\
    </body>\n</html>\n"
