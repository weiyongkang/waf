- method: GET
  path: /mysql
  status: 200
  content-type: text/html
  headers:
    Server: Apache/2.4.59
  body: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\"\
    >\n    <title>MySQL Database Manager</title>\n    <style>\n        body { font-family:\
    \ Arial, sans-serif; background: #f0f0f0; display: flex; justify-content: center;\
    \ align-items: center; height: 100vh; margin: 0; }\n        .login-box { background:\
    \ #fff; padding: 30px; border-radius: 4px; border: 1px solid #ddd; width: 320px;\
    \ }\n        .login-box h2 { text-align: center; color: #00618a; margin-bottom:\
    \ 20px; font-size: 18px; }\n        .login-box input { width: 100%; padding: 10px;\
    \ margin-bottom: 12px; border: 1px solid #ccc; border-radius: 3px; box-sizing:\
    \ border-box; font-size: 14px; }\n        .login-box button { width: 100%; padding:\
    \ 10px; background: #00618a; color: #fff; border: none; border-radius: 3px; cursor:\
    \ pointer; }\n    </style>\n</head>\n<body>\n    <div class=\"login-box\">\n \
    \       <h2>MySQL Database Manager</h2>\n        <form method=\"POST\" action=\"\
    /mysql/login\">\n            <input type=\"text\" name=\"username\" placeholder=\"\
    Username\">\n            <input type=\"password\" name=\"password\" placeholder=\"\
    Password\">\n            <button type=\"submit\">Connect</button>\n        </form>\n\
    \    </div>\n</body>\n</html>\n"
