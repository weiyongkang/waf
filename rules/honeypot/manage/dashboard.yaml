- method: GET
  path: /dashboard
  status: 200
  content-type: text/html
  headers:
    Server: nginx/1.25.3
  body: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <title>Dashboard</title>\n    <style>\n        body { font-family: -apple-system,\
    \ BlinkMacSystemFont, sans-serif; background: #f5f5f5; display: flex; justify-content:\
    \ center; align-items: center; height: 100vh; margin: 0; }\n        .login-box\
    \ { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 24px\
    \ rgba(0,0,0,0.08); width: 360px; }\n        .login-box h2 { text-align: center;\
    \ color: #1a1a1a; margin-bottom: 28px; font-size: 22px; }\n        .login-box\
    \ input { width: 100%; padding: 12px 16px; margin-bottom: 14px; border: 1px solid\
    \ #e5e5e5; border-radius: 8px; box-sizing: border-box; font-size: 15px; }\n  \
    \      .login-box button { width: 100%; padding: 12px; background: #000; color:\
    \ #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }\n\
    \    </style>\n</head>\n<body>\n    <div class=\"login-box\">\n        <h2>Dashboard</h2>\n\
    \        <form method=\"POST\" action=\"/dashboard/login\">\n            <input\
    \ type=\"email\" name=\"email\" placeholder=\"Email address\">\n            <input\
    \ type=\"password\" name=\"password\" placeholder=\"Password\">\n            <button\
    \ type=\"submit\">Sign In</button>\n        </form>\n    </div>\n</body>\n</html>\n"
