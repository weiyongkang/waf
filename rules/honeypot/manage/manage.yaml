- method: GET
  path: /manage
  status: 200
  content-type: text/html
  headers:
    Server: Apache/2.4.59
  body: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <title>Management Console</title>\n    <style>\n        body { font-family:\
    \ Arial, sans-serif; background: #fafafa; display: flex; justify-content: center;\
    \ align-items: center; height: 100vh; margin: 0; }\n        .login-box { background:\
    \ #fff; padding: 36px; border: 1px solid #e0e0e0; border-radius: 4px; width: 350px;\
    \ }\n        .login-box h2 { text-align: center; color: #444; margin-bottom: 24px;\
    \ font-size: 20px; }\n        .login-box input { width: 100%; padding: 10px; margin-bottom:\
    \ 12px; border: 1px solid #ccc; border-radius: 3px; box-sizing: border-box; }\n\
    \        .login-box button { width: 100%; padding: 10px; background: #5cb85c;\
    \ color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 15px;\
    \ }\n    </style>\n</head>\n<body>\n    <div class=\"login-box\">\n        <h2>Management\
    \ Console</h2>\n        <form method=\"POST\" action=\"/manage/login\">\n    \
    \        <input type=\"text\" name=\"username\" placeholder=\"Username\">\n  \
    \          <input type=\"password\" name=\"password\" placeholder=\"Password\"\
    >\n            <button type=\"submit\">Login</button>\n        </form>\n    </div>\n\
    </body>\n</html>\n"
