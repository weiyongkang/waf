# JFrog Artifactory 登录页
- method: GET
  path: "/artifactory"
  status: 200
  content-type: text/html
  headers:
    Server: "Artifactory/7.84.14"
  body: |
    <!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Artifactory</title><style>body{font-family:sans-serif;background:#2b2b2b;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#3c3c3c;padding:40px;width:340px;border-radius:6px;color:#e0e0e0}.login-box .logo{text-align:center;color:#43a047;font-size:22px;font-weight:bold;margin-bottom:28px}.login-box input{width:100%;padding:10px;margin-bottom:14px;background:#2b2b2b;border:1px solid #555;border-radius:4px;color:#e0e0e0;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#43a047;color:#fff;border:none;border-radius:4px;cursor:pointer}</style></head><body><div class=login-box><div class=logo>JFrog Artifactory</div><form method=POST action=/artifactory/ui/login><input type=text name=user placeholder=Username><input type=password name=password placeholder=Password><button type=submit>Log In</button></form></div></body></html>
