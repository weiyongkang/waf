    <!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Sentry</title><style>body{font-family:sans-serif;background:#f9f9fa;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#fff;padding:40px;width:360px;border:1px solid #e0e0e0;border-radius:4px}.login-box .logo{text-align:center;color:#362d59;font-size:24px;font-weight:600;margin-bottom:28px}.login-box input{width:100%;padding:10px;margin-bottom:14px;border:1px solid #d0d0d0;border-radius:3px;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#6c5fc7;color:#fff;border:none;border-radius:3px;cursor:pointer}</style></head><body><div class=login-box><div class=logo>Sentry</div><form method=POST action=/sentry/auth/login/><input type=text name=username placeholder=Username><input type=password name=password placeholder=Password><button type=submit>Sign In</button></form></div></body></html>
