# Rancher 容器管理平台登录页
- method: GET
  path: "/rancher"
  status: 200
  content-type: text/html
  headers:
    Server: "nginx"
  body: |
    <!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Rancher</title><style>body{font-family:sans-serif;background:#161b22;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#21262d;padding:40px;width:340px;border-radius:6px;color:#c9d1d9}.login-box .logo{text-align:center;color:#0075a8;font-size:22px;font-weight:bold;margin-bottom:16px}.login-box .sub{text-align:center;color:#8b949e;font-size:13px;margin-bottom:24px}.login-box input{width:100%;padding:10px;margin-bottom:14px;background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#0075a8;color:#fff;border:none;border-radius:4px;cursor:pointer}</style></head><body><div class=login-box><div class=logo>Rancher</div><div class=sub>Container Management Platform</div><form method=POST action=/rancher/login><input type=text name=username placeholder=Username><input type=password name=password placeholder=Password><button type=submit>Log In</button></form></div></body></html>
