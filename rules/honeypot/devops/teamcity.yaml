# JetBrains TeamCity CI/CD 登录页
- method: GET
  path: "/teamcity"
  status: 200
  content-type: text/html
  headers:
    Server: "nginx"
  body: |
    <!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>TeamCity</title><style>body{font-family:sans-serif;background:#232323;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#333;padding:40px;width:340px;border-radius:6px;color:#e0e0e0}.login-box .logo{text-align:center;color:#20c0e8;font-size:24px;font-weight:bold;margin-bottom:28px}.login-box input{width:100%;padding:10px;margin-bottom:14px;background:#232323;border:1px solid #555;border-radius:3px;color:#e0e0e0;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#20c0e8;color:#232323;border:none;border-radius:3px;cursor:pointer;font-weight:bold}</style></head><body><div class=login-box><div class=logo>TeamCity</div><form method=POST action=/teamcity/login.html><input type=text name=username placeholder=Username><input type=password name=password placeholder=Password><button type=submit>Log in</button></form></div></body></html>
