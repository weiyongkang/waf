# Portainer Docker 管理界面
- method: GET
  path: "/portainer"
  status: 200
  content-type: text/html
  headers:
    Server: "nginx"
  body: |
    <!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Portainer</title><style>body{font-family:sans-serif;background:#132144;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#1b2d5c;padding:40px;width:340px;border-radius:6px;color:#e0e8f0}.login-box .logo{text-align:center;color:#1db6f3;font-size:22px;font-weight:bold;margin-bottom:28px}.login-box input{width:100%;padding:10px;margin-bottom:14px;background:#132144;border:1px solid #2a4a8c;border-radius:3px;color:#e0e8f0;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#1db6f3;color:#fff;border:none;border-radius:3px;cursor:pointer}</style></head><body><div class=login-box><div class=logo>Portainer</div><form method=POST action=/portainer/api/auth><input type=text name=username placeholder=Username><input type=password name=password placeholder=Password><button type=submit>Login</button></form></div></body></html>
