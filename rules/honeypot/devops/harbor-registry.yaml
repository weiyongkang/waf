# Harbor 容器镜像仓库登录页
- method: GET
  path: "/harbor"
  status: 200
  content-type: text/html
  headers:
    Server: "nginx"
  body: |
    <!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Harbor</title><style>body{font-family:sans-serif;background:#f2f4f7;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#fff;padding:40px;width:360px;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.06)}.login-box .logo{text-align:center;color:#0095d3;font-size:24px;font-weight:600;margin-bottom:28px}.login-box input{width:100%;padding:10px;margin-bottom:14px;border:1px solid #ccc;border-radius:3px;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#0095d3;color:#fff;border:none;border-radius:3px;cursor:pointer}</style></head><body><div class=login-box><div class=logo>HARBOR</div><form method=POST action=/harbor/c/login><input type=text name=principal placeholder=Username><input type=password name=password placeholder=Password><button type=submit>Login</button></form></div></body></html>
