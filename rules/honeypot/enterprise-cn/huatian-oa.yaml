# 华天动力 OA 协同办公系统
- method: GET
  path: "/oa/"
  status: 200
  content-type: text/html
  headers:
    Server: "nginx"
  body: |
    <!DOCTYPE html><html lang=zh-CN><head><meta charset=utf-8><title>华天动力OA</title><style>body{font-family:"Microsoft YaHei",sans-serif;background:#e8f0fe;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#fff;padding:40px;width:340px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.05)}.login-box h2{text-align:center;color:#1a73e8;margin-bottom:28px}.login-box input{width:100%;padding:10px;margin-bottom:14px;border:1px solid #dadce0;border-radius:4px;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#1a73e8;color:#fff;border:none;border-radius:4px;cursor:pointer}</style></head><body><div class=login-box><h2>华天动力OA</h2><form method=POST action=/oa/login><input type=text name=username placeholder=用户名><input type=password name=password placeholder=密码><button type=submit>登 录</button></form></div></body></html>
