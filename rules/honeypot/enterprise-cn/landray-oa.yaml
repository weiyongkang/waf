# 蓝凌 Landray OA/EKP 平台
- method: GET
  path: "/ekp/"
  status: 200
  content-type: text/html
  headers:
    Server: "nginx"
  body: |
    <!DOCTYPE html><html lang=zh-CN><head><meta charset=utf-8><title>蓝凌OA</title><style>body{font-family:"Microsoft YaHei",sans-serif;background:#f0f4f8;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#fff;padding:40px;width:360px;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.06)}.login-box .logo{text-align:center;color:#005bac;font-size:22px;font-weight:bold;margin-bottom:24px}.login-box input{width:100%;padding:10px;margin-bottom:14px;border:1px solid #d0d7de;border-radius:4px;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#005bac;color:#fff;border:none;border-radius:4px;cursor:pointer}</style></head><body><div class=login-box><div class=logo>蓝凌OA</div><form method=POST action=/ekp/login><input type=text name=username placeholder=用户名><input type=password name=password placeholder=密码><button type=submit>登 录</button></form></div></body></html>
