# 泛微云桥 e-Bridge 登录页
- method: GET
  path: "/wui/login.html"
  status: 200
  content-type: text/html
  headers:
    Server: "nginx"
  body: |
    <!DOCTYPE html><html lang=zh-CN><head><meta charset=utf-8><title>泛微云桥</title>
    <style>body{font-family:"Microsoft YaHei",sans-serif;background:#f5f6fa;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#fff;padding:40px;border-radius:6px;width:360px;box-shadow:0 2px 16px rgba(0,0,0,.06)}.login-box h2{text-align:center;color:#333;margin-bottom:28px;font-weight:400}.login-box input{width:100%;padding:10px;margin-bottom:14px;border:1px solid #e0e0e0;border-radius:4px;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#1890ff;color:#fff;border:none;border-radius:4px;cursor:pointer}</style></head>
    <body><div class=login-box><h2>泛微云桥 e-Bridge</h2><form method=POST action=/wui/login><input type=text name=username placeholder=用户名><input type=password name=password placeholder=密码><button type=submit>登录</button></form></div></body></html>
