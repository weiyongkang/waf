# 蓝凌 Landray EKP 登录页
- method: GET
  path: "/ekp/login.jsp"
  status: 200
  content-type: text/html
  headers:
    Server: "nginx"
  body: |
    <!DOCTYPE html><html lang=zh-CN><head><meta charset=utf-8><title>蓝凌OA</title>
    <style>body{font-family:"Microsoft YaHei",sans-serif;background:#e8edf5;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#fff;padding:40px;border-radius:4px;width:360px;box-shadow:0 2px 12px rgba(0,0,0,.06)}.login-box .logo{text-align:center;color:#2b7bd6;font-size:22px;font-weight:bold;margin-bottom:24px}.login-box input{width:100%;padding:10px;margin-bottom:14px;border:1px solid #d0d0d0;border-radius:3px;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#2b7bd6;color:#fff;border:none;border-radius:3px;cursor:pointer}</style></head>
    <body><div class=login-box><div class=logo>蓝凌 EKP</div><form method=POST action=/ekp/servlet/login><input type=text name=username placeholder=用户名><input type=password name=password placeholder=密码><button type=submit>登 录</button></form></div></body></html>
