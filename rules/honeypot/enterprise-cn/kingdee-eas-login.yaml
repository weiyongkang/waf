# 金蝶 EAS 登录页
- method: GET
  path: "/eas/login.jsp"
  status: 200
  content-type: text/html
  headers:
    Server: "nginx"
  body: |
    <!DOCTYPE html><html lang=zh-CN><head><meta charset=utf-8><title>金蝶EAS</title>
    <style>body{font-family:"Microsoft YaHei",sans-serif;background:#dce8f5;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#fff;padding:40px;border-radius:6px;width:360px;box-shadow:0 2px 16px rgba(0,0,0,.08)}.login-box .logo{text-align:center;color:#0072e3;font-size:22px;font-weight:bold;margin-bottom:24px}.login-box input{width:100%;padding:10px;margin-bottom:14px;border:1px solid #d0d0d0;border-radius:3px;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#0072e3;color:#fff;border:none;border-radius:3px;cursor:pointer}</style></head>
    <body><div class=login-box><div class=logo>金蝶EAS</div><form method=POST action=/eas/login.jsp><input type=text name=username placeholder=用户名><input type=password name=password placeholder=密码><button type=submit>登 录</button></form></div></body></html>
