# 华天动力 Huatian OA 登录页
- method: GET
  path: "/oa/login.jsp"
  status: 200
  content-type: text/html
  headers:
    Server: "Apache/2.4.57"
  body: |
    <!DOCTYPE html><html lang=zh-CN><head><meta charset=utf-8><title>华天动力OA</title>
    <style>body{font-family:"Microsoft YaHei",sans-serif;background:#eef3f8;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#fff;padding:36px;border-radius:4px;width:340px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.login-box h2{text-align:center;color:#2d8cf0;font-weight:400;margin-bottom:28px}.login-box input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #d0d0d0;border-radius:3px;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#2d8cf0;color:#fff;border:none;border-radius:3px;cursor:pointer}</style></head>
    <body><div class=login-box><h2>华天动力协同OA</h2><form method=POST action=/oa/login.jsp><input type=text name=username placeholder=用户名><input type=password name=password placeholder=密码><button type=submit>登 录</button></form></div></body></html>
