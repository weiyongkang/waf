# JEECG Boot 低代码开发平台
- method: GET
  path: "/jeecg-boot/"
  status: 200
  content-type: text/html
  headers:
    Server: "nginx"
  body: |
    <!DOCTYPE html><html lang=zh-CN><head><meta charset=utf-8><title>JEECG Boot</title><style>body{font-family:"Microsoft YaHei",sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.login-box{background:#fff;padding:44px;width:380px;border-radius:6px;box-shadow:0 2px 16px rgba(0,0,0,.06)}.login-box h2{text-align:center;color:#1890ff;margin-bottom:8px}.login-box .sub{text-align:center;color:#999;font-size:13px;margin-bottom:28px}.login-box input{width:100%;padding:10px;margin-bottom:14px;border:1px solid #d9d9d9;border-radius:4px;box-sizing:border-box}.login-box button{width:100%;padding:10px;background:#1890ff;color:#fff;border:none;border-radius:4px;cursor:pointer}</style></head><body><div class=login-box><h2>JEECG Boot</h2><div class=sub>低代码开发平台</div><form method=POST action=/jeecg-boot/login><input type=text name=username placeholder=用户名><input type=password name=password placeholder=密码><input type=text name=captcha placeholder=验证码 style=width:50%><button type=submit>登 录</button></form></div></body></html>
