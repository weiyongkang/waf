# =============================================================================
# Nginx(OpenResty) forward-auth 接入配置（推荐形态，需求 R9 / R24）
# =============================================================================
#
# 为什么必须使用 OpenResty：
#   Nginx 原生 auth_request 子请求是「只有头、没有体」的：
#     1) 不转发请求体  -> 无法做请求体检测；
#     2) 丢弃响应体    -> 无法把 JSON 错误体送达客户端。
#   而 OpenResty 的 ngx.location.capture 可以同时拿到子请求的 状态码 / 响应头 / 响应体，
#   因此既能转发请求体，也能把 WAF 的 JSON 错误体一步到位地回写给客户端。
#
# 前置条件：
#   - OpenResty >= 1.21（内置 ngx.location.capture）；
#   - 本文件中的 <...> 占位符需按实际环境替换；
#   - WAF 监听地址与 configs/waf.example.yaml 的 server.listen 保持一致。
#
# 装载方式（在 /usr/local/openresty/nginx/conf/nginx.conf 的 http {} 内 include 本文件）。

# 让 Lua 脚本可以通过 require("waf_auth") 加载（部署时把 waf_auth.lua 放到该目录）。
lua_package_path "/etc/waf/lua/?.lua;;";

# 共享字典：用于在 Lua 与 Nginx 之间传递鉴权结论（可控开关，容量可调）。
lua_shared_dict waf_auth_cache 10m;

# 内部鉴权通道：把子请求代理到 WAF 的 forward-auth 端点。
upstream waf_auth_backend {
    # WAF 监听地址；生产环境建议改为内网专用地址或 Unix Socket。
    server 127.0.0.1:9080;

    # 保持长连接，避免每个请求都重新建连（鉴权子请求频率极高）。
    keepalive 64;

    # 鉴权不可用时快速失败，避免业务请求被长时间挂起。
    # 注意：这里的失败行为由 waf_auth.lua 的 FAIL_OPEN 开关决定，属于「失败关闭」语义。
}

server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------------------
    # 请求体相关：必须打开，否则 WAF 拿不到请求体
    # ---------------------------------------------------------------------------
    # client_max_body_size 必须 >= ingress.body.max_bytes，
    # 否则 Nginx 会先于 WAF 返回 413，导致 WAF 的体检测策略失效。
    client_max_body_size 16m;
    # 请求体预读缓冲：开大一些可让 ngx.req.read_body() 直接从内存拿到体，
    # 减少落盘开销；具体取值需按业务请求体大小分布调整。
    client_body_buffer_size 256k;

    # ---------------------------------------------------------------------------
    # 内部鉴权子请求端点（仅供 Lua 通过 ngx.location.capture 调用，外部不可访问）
    # ---------------------------------------------------------------------------
    #
    # 关键：这里的 $http_x_forwarded_* / $http_x_real_ip 来自 waf_auth.lua 在父请求上
    # 通过 ngx.req.set_header 注入的请求头（nginx 子请求共享父请求的 headers_in）。
    #
    # 为什么不能直接用 $request_uri / $request_method：
    #   本 location 处理的是**子请求**，其 URI 固定为 /__waf_auth、方法为 capture 指定的方法，
    #   直接引用会把内部路径当成「被保护的原始请求」传给 WAF。
    location = /__waf_auth {
        internal;

        # 转发到 WAF 的 forward-auth 端点。
        proxy_pass http://waf_auth_backend/waf/auth;

        # 关键：请求体随子请求一起转发（这是体检测的前提）。
        proxy_pass_request_body on;
        proxy_set_header Content-Length $content_length;
        proxy_set_header Content-Type $content_type;

        # 还原原始请求信息：全部取自父请求注入的头，语义无歧义。
        proxy_set_header X-Forwarded-Uri          $http_x_forwarded_uri;
        proxy_set_header X-Original-URI           $http_x_original_uri;
        proxy_set_header X-Forwarded-Method       $http_x_forwarded_method;
        proxy_set_header X-Forwarded-Proto        $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host         $http_x_forwarded_host;
        proxy_set_header X-Real-IP                $http_x_real_ip;
        proxy_set_header X-Forwarded-For          $http_x_forwarded_for;

        # 鉴权子请求不允许被任何中间层缓存。
        proxy_buffering off;
        proxy_cache off;

        # 超时：鉴权必须比业务更快失败，避免拖垮整体时延。
        proxy_connect_timeout 1s;
        proxy_send_timeout    2s;
        proxy_read_timeout    2s;
    }

    # ---------------------------------------------------------------------------
    # 蜜罐 / JSON 错误体渲染端点（内部）：Lua 统一回源渲染，
    # 保证三个代理通道的蜜罐页面与错误体格式一致。
    # ---------------------------------------------------------------------------
    location = /__waf_deny {
        internal;
        proxy_pass http://waf_auth_backend/waf/deny;

        # 渲染端点需要原始请求信息重新匹配蜜罐规则；这些头由
        # waf_auth.lua 的 injectOriginalRequestHeaders 写入父请求，子请求自动继承。
        proxy_set_header X-Forwarded-Uri    $http_x_forwarded_uri;
        proxy_set_header X-Original-URI     $http_x_original_uri;
        proxy_set_header X-Forwarded-Method $http_x_forwarded_method;
        proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host   $http_x_forwarded_host;
        proxy_set_header X-Real-IP          $http_x_real_ip;
        proxy_set_header X-Forwarded-For    $http_x_forwarded_for;

        proxy_buffering off;
        proxy_read_timeout 2s;
    }

    # ---------------------------------------------------------------------------
    # 业务入口：access 阶段先执行鉴权，通过后再放行到业务后端
    # ---------------------------------------------------------------------------
    location / {
        # access_by_lua_block 在 access 阶段执行，早于 proxy_pass，
        # 因此可以在请求转发给业务之前完成拦截。
        access_by_lua_block {
            require("waf_auth").check()
        }

        # 业务后端（按实际环境替换）。
        proxy_pass http://127.0.0.1:8080;

        # 内部透传用的头不应该泄漏给业务后端：显式置空以移除。
        proxy_set_header X-Forwarded-Uri   "";
        proxy_set_header X-Original-URI    "";
        proxy_set_header X-Forwarded-Method "";

        # 业务侧需要的原始请求信息（由 waf_auth.lua 注入，语义已规范化）。
        proxy_set_header Host              $http_x_forwarded_host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
