# =============================================================================
# Nginx（原生）forward-auth 降级接入配置
# =============================================================================
#
# 定位：仅作「兜底」，不推荐用于生产（需求 R9 / R24）。
#
# 能力边界（必须向业务方明确说明）：
#   1) 无请求体检测：auth_request 子请求是 header-only 的，不携带请求体，
#      因此 WAF 只能看到请求行与请求头；
#      连带后果：Content-Length 也一并被剥离，WAF 无法区分「客户端声明了空请求体」
#      与「本通道拿不到请求体」。因此 WAF 会把该通道下的 Content-Length 统一视为
#      「未知」(-1)：ingress.body.mode 配成 required 时，POST / PUT / PATCH 的无体请求
#      仍会计入 waf_body_missing_total。请把 mode 设为 optional 或 disabled，
#      并接受「本通道不具备请求体检测能力」这一事实（WAF 启动日志会就此打 Warn）。
#   2) 无 WAF 渲染的响应体：auth_request 会丢弃子请求的响应体，
#      本文件用 Nginx 本地模板生成 JSON，格式由本文件维护而非 WAF 输出；
#   3) 状态码受限：auth_request 只透传 401 与 403，其它状态码（429/503 等）
#      会被 Nginx 一律改写为 500。因此本通道下 WAF 统一返回 403，
#      真实原因通过响应头 X-WAF-Code 表达（本文件把它透传给客户端）。
#
# 若需要「请求体检测 + WAF 原生 JSON 错误体」，请改用
# deploy/forward-auth/nginx-openresty.conf（推荐形态）。

upstream waf_auth_backend {
    server 127.0.0.1:9080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------------------
    # 内部鉴权端点：仅供 auth_request 调用，外部不可访问
    # ---------------------------------------------------------------------------
    location = /__waf_auth {
        internal;

        proxy_pass http://waf_auth_backend/waf/auth;

        # auth_request 子请求本身不带请求体，这里显式关闭体转发，避免误导。
        # 注意：这两行同时也会把 Content-Length 抹掉，WAF 侧因此只能把长度记为「未知」，
        # 绝不会当成「客户端声明了空请求体」——这是 WAF 判定「请求体缺失」的必要前提。
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Content-Type "";

        # 还原原始请求信息（无请求体通道下，这些头是 WAF 唯一的信息来源）。
        proxy_set_header X-Forwarded-Uri    $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;

        proxy_connect_timeout 1s;
        proxy_read_timeout    2s;
    }

    # ---------------------------------------------------------------------------
    # 业务入口：auth_request 阶段先鉴权
    # ---------------------------------------------------------------------------
    location / {
        # 发起鉴权子请求；非 2xx 即视为鉴权失败。
        auth_request /__waf_auth;

        # 关键：读取鉴权的「响应头」（这是本形态下唯一可用的信息通道）。
        # 子请求的响应体会被丢弃，因此错误体只能由本文件本地渲染。
        auth_request_set $waf_code        $upstream_http_x_waf_code;
        auth_request_set $waf_request_id  $upstream_http_x_waf_request_id;
        auth_request_set $waf_verdict     $upstream_http_x_waf_verdict;

        # 把真实原因透传给客户端，便于业务侧排障与前端提示区分。
        add_header X-WAF-Code       $waf_code       always;
        add_header X-WAF-Request-Id $waf_request_id always;
        add_header X-WAF-Verdict    $waf_verdict    always;

        # 鉴权失败统一转为本地渲染的 JSON 错误页。
        # 覆盖 401/403 以及 WAF 不可达时的 500/502/503/504。
        error_page 401 403 500 502 503 504 = @waf_denied;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------------
    # JSON 错误体本地渲染（注意：本形态下发不出 WAF 原生错误体）
    # ---------------------------------------------------------------------------
    location @waf_denied {
        # 统一按 403 返回：auth_request 通道无法保留 WAF 的真实状态码，
        # 真实原因由 X-WAF-Code 响应头承载。
        default_type application/json;
        # 禁止任何中间层缓存拦截响应。
        add_header Cache-Control "no-store" always;
        add_header X-WAF-Code   $waf_code       always;
        add_header X-WAF-Verdict $waf_verdict   always;

        # return 的文本支持变量插值；$waf_code 为空时降级为 WAF_BLOCKED。
        return 403 '{"code":"${waf_code}","message":"请求被安全策略拦截","request_id":"${waf_request_id}"}';
    }
}