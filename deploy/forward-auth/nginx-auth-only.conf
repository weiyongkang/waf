# =============================================================================
# Nginx（原生）forward-auth 降级接入配置
# =============================================================================
#
# 定位：仅作「兜底」，不推荐用于生产（需求 R9 / R24）。
#
# 能力边界（必须向业务方明确说明）：
#   1) 无请求体检测：auth_request 子请求是 header-only 的，不携带请求体，
#      因此 WAF 只能看到请求行与请求头；
#      连带后果：Content-Length 也一并被剥离，WAF 无法区分「客户端声明了空请求体」
#      与「本通道拿不到请求体」。因此 WAF 会把该通道下的 Content-Length 统一视为
#      「未知」(-1)：ingress.body.mode 配成 required 时，POST / PUT / PATCH 的无体请求
#      仍会计入 waf_body_missing_total。请把 mode 设为 optional 或 disabled，
#      并接受「本通道不具备请求体检测能力」这一事实（WAF 启动日志会就此打 Warn）。
#   2) 鉴权子请求响应体会被 auth_request 丢弃：本文件通过 error_page
#      回源 WAF /waf/deny 渲染端点，蜜罐页面与 JSON 错误体统一由 WAF 生成；
#   3) 状态码受限：auth_request 只透传 401 与 403，其它状态码（429/503 等）
#      会被 Nginx 一律改写为 500。本文件用 error_page 500 回源 /waf/deny，
#      由渲染端点返回最终状态码；真实原因仍由 X-WAF-Code 承载。
#
# 若需要「请求体检测 + WAF 原生 JSON 错误体」，请改用
# deploy/forward-auth/nginx-openresty.conf（推荐形态）。

upstream waf_auth_backend {
    server 127.0.0.1:9080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------------------
    # 内部鉴权端点：仅供 auth_request 调用，外部不可访问
    # ---------------------------------------------------------------------------
    location = /__waf_auth {
        internal;

        proxy_pass http://waf_auth_backend/waf/auth;

        # auth_request 子请求本身不带请求体，这里显式关闭体转发，避免误导。
        # 注意：这两行同时也会把 Content-Length 抹掉，WAF 侧因此只能把长度记为「未知」，
        # 绝不会当成「客户端声明了空请求体」——这是 WAF 判定「请求体缺失」的必要前提。
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Content-Type "";

        # 还原原始请求信息（无请求体通道下，这些头是 WAF 唯一的信息来源）。
        proxy_set_header X-Forwarded-Uri    $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;

        proxy_connect_timeout 1s;
        proxy_read_timeout    2s;
    }

    # ---------------------------------------------------------------------------
    # 业务入口：auth_request 阶段先鉴权
    # ---------------------------------------------------------------------------
    location / {
        # 发起鉴权子请求；非 2xx 即视为鉴权失败。
        auth_request /__waf_auth;

        # 关键：读取鉴权的「响应头」（这是本形态下唯一可用的信息通道）。
        # 子请求的响应体会被丢弃，因此最终响应由 @waf_render 回源 WAF 生成。
        auth_request_set $waf_code        $upstream_http_x_waf_code;
        auth_request_set $waf_request_id  $upstream_http_x_waf_request_id;
        auth_request_set $waf_verdict     $upstream_http_x_waf_verdict;
        auth_request_set $waf_target      $upstream_http_x_waf_target;
        auth_request_set $waf_ban_scope   $upstream_http_x_waf_ban_scope;

        # 把真实原因透传给客户端，便于业务侧排障与前端提示区分。
        add_header X-WAF-Code       $waf_code       always;
        add_header X-WAF-Request-Id $waf_request_id always;
        add_header X-WAF-Verdict    $waf_verdict    always;
        add_header X-WAF-Target     $waf_target     always;
        add_header X-WAF-Ban-Scope  $waf_ban_scope  always;

        # 鉴权失败统一回源 WAF 渲染端点：
        #   - 蜜罐命中：返回规则定义的 200/404/... 页面；
        #   - 普通拦截：返回 WAF 的 JSON 错误体；
        #   - 429/503 被 auth_request 改写成 500 的情况也走同一入口。
        error_page 401 403 500 502 503 504 = @waf_render;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------------
    # WAF 渲染回源：蜜罐页面与 JSON 错误体都由同一个端点生成。
    # ---------------------------------------------------------------------------
    location @waf_render {
        internal;

        # $waf_code 由 auth_request_set 捕获；为空时 WAF 按普通拦截兜底。
        proxy_pass http://waf_auth_backend/waf/deny?code=$waf_code&request_id=$waf_request_id;

        # 渲染端点必须拿到原始请求信息，才能重新匹配蜜罐规则。
        proxy_set_header X-Forwarded-Uri    $request_uri;
        proxy_set_header X-Original-URI     $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-WAF-Request-Id   $waf_request_id;
        proxy_set_header X-WAF-Target       $waf_target;
        proxy_set_header X-WAF-Ban-Scope    $waf_ban_scope;

        # 渲染端点的 4xx/5xx 是最终响应，不能再触发本 location 的 error_page。
        proxy_intercept_errors off;
        proxy_buffering off;
        proxy_read_timeout 2s;

        # WAF 渲染端点自身不可达时的本地兜底。
        error_page 502 504 = @waf_unavailable;
    }

    # WAF 不可达时的最小 JSON 兜底，避免返回 Nginx 默认 HTML 错误页。
    location @waf_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"WAF_UNAVAILABLE","message":"安全检测服务暂时不可用","request_id":"${waf_request_id}"}';
    }
}
